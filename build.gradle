import gr1mly4memes.felt.gradle.tasks.UploadFilesTask

plugins {
    id 'net.fabricmc.fabric-loom' apply false
    id 'com.gradleup.shadow' version "${gradleup_shadow_version}" apply false
}

allprojects {
    apply plugin: 'java'

    group 'gr1mly4memes.felt'
    version "${felt_version}${felt_snapshot == 'true' ? '-SNAPSHOT' : ''}"

    def getGitHash = { ->
        def stdout = new ByteArrayOutputStream()
        return providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
        }.standardOutput.asText.get().trim()
    }

    ext {
        versionName = '26.4'
        gitHash = getGitHash()
        feltProject = project(':felt-fabric')
        platformProjects = [ext.feltProject]
        subProjects = ext.platformProjects
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://maven.izzel.io/releases' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://jitpack.io' }
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:${lombok_version}"
        annotationProcessor "org.projectlombok:lombok:${lombok_version}"
        compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
    }

    tasks.register('cleanBuild') {
        doFirst {
            project.file("build/libs").deleteDir()
        }
    }
}

def paperActions = [verifyPaperUpstream: 'verify', applyPaperPatches: 'apply',
                    rebuildPaperPatches: 'rebuild', checkPaperPatches: 'check']
paperActions.each { taskName, action ->
    tasks.register(taskName, gr1mly4memes.felt.gradle.tasks.PaperSourcesTask) {
        group = 'paper sources'
        description = [
            verify: 'Verify the pinned Paper checkout is safe to use as Felt source code.',
            apply: 'Apply committed Felt patches directly to a clean upstream/Paper checkout.',
            rebuild: 'Regenerate Felt patch files from edits in upstream/Paper.',
            check: 'Verify upstream/Paper edits match the committed Felt patch files.'
        ][action]
        sourceRoot = rootDir
        operation = action
        selectedGroup = providers.gradleProperty('paperGroup').getOrElse('')
        inputs.file('build-support/paper-sources.json')
        if (action != 'verify') inputs.dir(selectedGroup ? "patches/${selectedGroup}" : 'patches')
        if (action == 'apply') dependsOn 'verifyPaperUpstream'
        if (action == 'rebuild' || action == 'check') mustRunAfter 'applyPaperPatches'
    }
}

rootProject.ext.subProjects.each { Project p ->
    configure(p) {
        apply plugin: 'net.fabricmc.fabric-loom'

        loom {
            addMinecraftJarProcessor(
                gr1mly4memes.felt.gradle.processor.FieldInjectionProcessor,
                'felt:field-injection-v1',
                rootProject.file('felt-fabric/src/main/resources/architectury.common.json'),
                p
            )
            addMinecraftJarProcessor(
                gr1mly4memes.felt.gradle.processor.StaticMethodInjectionProcessor,
                'felt:static-method-injection-v2',
                rootProject.file('felt-fabric/src/main/resources/architectury.common.json')
            )
            interfaceInjection {
                enableDependencyInterfaceInjection = false
            }
        }

        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }

            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
            developmentFabric.extendsFrom common

            shadowBundle {
                canBeResolved = true
                canBeConsumed = false
            }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${minecraft_version}"

        }

        java {
            withSourcesJar()
        }
    }
}

def verifyFieldInjections = project(':felt-fabric').tasks.register('verifyFieldInjections', gr1mly4memes.felt.gradle.tasks.VerifyFieldInjections) {
    def felt = rootProject.ext.feltProject
    specification.set(felt.layout.projectDirectory.file('src/main/resources/architectury.common.json'))
    classes.from(felt.sourceSets.main.output.classesDirs)
    mixinConfigs.from(felt.fileTree('src/main/resources') { include 'mixins.felt.*.json' })
    dependsOn felt.tasks.named('compileJava')
}
def verifyStaticMethodInjections = project(':felt-fabric').tasks.register('verifyStaticMethodInjections', gr1mly4memes.felt.gradle.tasks.VerifyStaticMethodInjections) {
    def felt = rootProject.ext.feltProject
    specification.set(felt.layout.projectDirectory.file('src/main/resources/architectury.common.json'))
    classes.from(felt.sourceSets.main.output.classesDirs)
    mixinConfigs.from(felt.fileTree('src/main/resources') { include 'mixins.felt.*.json' })
    dependsOn felt.tasks.named('compileJava')
}
project(':felt-fabric').tasks.named('check') { dependsOn verifyStaticMethodInjections, verifyFieldInjections }
project(':felt-fabric').tasks.named('jar') { dependsOn verifyFieldInjections, verifyStaticMethodInjections }

rootProject.ext.platformProjects.each { Project p ->
    configure(p) {
        apply plugin: 'net.fabricmc.fabric-loom'
        apply plugin: 'com.gradleup.shadow'
        tasks.named('shadowJar') { dependsOn verifyFieldInjections, verifyStaticMethodInjections }

        jar {
            manifest.attributes 'MixinConnector': 'gr1mly4memes.felt.mod.FeltConnector'
            manifest.attributes 'Implementation-Title': 'Felt'
            manifest.attributes 'Implementation-Version': "${p.name}-${minecraft_version}-${project.version}+$gitHash"
            manifest.attributes 'Implementation-Vendor': 'Felt Team'
            manifest.attributes 'Implementation-Timestamp': new Date().format("yyyy-MM-dd HH:mm:ss")
            manifest.attributes 'Brand-Id': 'felt:felt'
            manifest.attributes 'Brand-Name': 'Felt'
            manifest.attributes 'Git-Commit': gitHash
            manifest.attributes 'Build-Time': java.time.Instant.now().toString()
        }

        components.java {
            withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
                skip()
            }
        }
    }
}

jar.enabled = false

tasks.register('collect', Copy) {
    destinationDir = file('build/libs')
    from project(':bootstrap').tasks.fabricJar.outputs
}

def gitBranch() {
    def stdout = new ByteArrayOutputStream()
    return providers.exec {
        commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
    }.standardOutput.asText.get().trim()
}

tasks.register('uploadFiles', UploadFilesTask) {
    mcVersion.set minecraft_version
    version.set "${project.version}-${project.ext.gitHash}"
    snapshot.set project.version.toString().endsWith('-SNAPSHOT')
    gitHash.set project.ext.gitHash
    branch.set gitBranch()
    inputs.files tasks.collect.outputs.files
    dependsOn(tasks.collect)
}

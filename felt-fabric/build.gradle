plugins {
    id 'com.gradleup.shadow'
}

loom {
    accessWidenerPath = file('src/main/resources/felt.accesswidener')
}

sourceSets.main {
    java.srcDir rootProject.file('upstream/Paper/paper-server/src/main/java')
    java.srcDir rootProject.file('upstream/Paper/paper-server/src/generated/java')
    // Minecraft itself remains supplied by Loom; every Paper-owned server class is
    // compiled from the editable upstream checkout.
    java.exclude 'net/minecraft/**'
    resources {
        srcDir rootProject.file('upstream/Paper/paper-server/src/main/resources')
        // The pinned upstream retains these obsolete descriptors without their service types/providers.
        // Keep the actual plugin, lifecycle, registry and Adventure providers from the patched server tree.
        exclude 'META-INF/services/io.papermc.paper.command.brigadier.CommandBuilderProvider'
        exclude 'META-INF/services/io.papermc.paper.world.flag.FeatureFlags$FeatureFlagProvider'
    }
}
tasks.named('compileJava') { dependsOn rootProject.tasks.named('verifyPaperUpstream') }
tasks.named('processResources') { dependsOn rootProject.tasks.named('verifyPaperUpstream') }
tasks.named('processResources') {
    dependsOn project(':bootstrap').tasks.named('fabricAsyncCatcher')
    from(project(':bootstrap').layout.buildDirectory.dir('fabric_async_catcher'))
}

configurations {
    mixinProcessorSupport
    compileClasspath {
        // Keep the shared Mixin version aligned with the MixinExtras metadata used here.
        resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
        resolutionStrategy.force 'com.google.code.gson:gson:2.13.2'
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation project(':felt-paper-api')
    shadowBundle(project(':felt-paper-api')) { transitive = false }
    implementation "org.jline:jline:${jline_version}"
    shadowBundle("org.jline:jline:${jline_version}") { transitive = false }
    implementation("io.netty:netty-codec-haproxy:4.2.16.Final") { transitive = false }
    shadowBundle("io.netty:netty-codec-haproxy:4.2.16.Final") { transitive = false }

    implementation "me.lucko:fabric-permissions-api:${fabric_permissions_api_version}"
    include "me.lucko:fabric-permissions-api:${fabric_permissions_api_version}"

    common(project(':bootstrap')) { transitive = false }
    shadowBundle(project(':bootstrap')) { transitive = false }

    implementation "org.spongepowered:configurate-yaml:${configurate_paper_version}"
    implementation("com.googlecode.json-simple:json-simple:${json_simple_version}") { transitive = false }
    implementation platform("net.kyori:adventure-bom:${adventure_version}")
    implementation "net.kyori:adventure-text-serializer-ansi"

    implementation "com.github.gr1mly4memes:felttools:${felttools_version}"
    annotationProcessor "com.github.gr1mly4memes:felttools:${felttools_version}"
    mixinProcessorSupport "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    mixinProcessorSupport "com.google.code.gson:gson:${gson_version}"
    mixinProcessorSupport "com.google.guava:guava:${paper_guava_version}"
    mixinProcessorSupport "org.ow2.asm:asm-util:${asm_version}"
    mixinProcessorSupport "org.ow2.asm:asm-tree:${asm_version}"

    implementation platform("ca.spottedleaf.leafpile:bom:${leafpile_version}")
    implementation "ca.spottedleaf.leafpile:common"
    implementation "ca.spottedleaf.leafpile:concurrentutil"
    implementation "ca.spottedleaf.leafpile:converter"
    implementation "ca.spottedleaf.leafpile:ioutil"
    // Native Moonrise needs these at runtime; development's implementation classpath
    // does not make them part of the common.jar embedded by the server launcher.
    shadowBundle platform("ca.spottedleaf.leafpile:bom:${leafpile_version}")
    ['common', 'concurrentutil', 'converter', 'ioutil'].each { module ->
        shadowBundle("ca.spottedleaf.leafpile:${module}") { transitive = false }
    }
    implementation "org.jline:jline-terminal-ffm:${jline_terminal_ffm_version}"

    implementation "net.minecrell:terminalconsoleappender:${terminal_console_appender_version}"
    implementation "org.apache.commons:commons-lang3:${commons_lang3_version}"
    implementation "com.google.code.findbugs:jsr305:${jsr305_version}"
    implementation "net.md-5:SpecialSource:${special_source_version}"
    implementation "org.apache.logging.log4j:log4j-jul:${log4j_version}"
    implementation "com.mysql:mysql-connector-j:${mysql_connector_j_version}"
    runtimeOnly "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    implementation "org.yaml:snakeyaml:${snakeyaml_version}"

    implementation "me.lucko:spark-api:${spark_api_version}"
    implementation "me.lucko:spark-paper:${spark_paper_version}"
    // Paper's CraftServer constructor instantiates io.papermc.paper.SparksFly, which needs the
    // bundled spark implementation at runtime (Paper shades it into the server jar as well).
    shadowBundle("me.lucko:spark-paper:${spark_paper_version}") { transitive = false }
}

compileJava {
    // No obfuscation/refmap AP in official-only builds; retain code generators.
    options.compilerArgs += ['-processor', 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor,lombok.launch.AnnotationProcessorHider$ClaimingProcessor,gr1mly4memes.felttools.mixin.ap.EjectProvider']
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
    options.annotationProcessorPath = configurations.annotationProcessor + configurations.mixinProcessorSupport
    options.encoding = 'UTF-8'
}

processResources {
    def ver = "${project.version}+$gitHash"
    inputs.property 'version', ver

    filesMatching('fabric.mod.json') {
        expand 'version': ver
    }
    from(rootProject.file('upstream/Paper')) {
        include 'LICENSE.md', 'licenses/**'
        into 'META-INF/paper-server'
    }
    from(rootProject.file('upstream/Paper/paper-server/src/main/resources/data/minecraft/datapacks/paper')) {
        include 'data/paper/chat_type/raw.json'
    }
}

shadowJar {
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

// The bootstrap embeds the shadow JAR, not Loom's standard jar output.
loom.nestJars(tasks.named('shadowJar'), configurations.named('include'))

def verifyMoonriseDistribution = tasks.register('verifyMoonriseDistribution') {
    group = 'verification'
    description = 'Verify every Leafpile runtime class is included in the distributed common jar.'
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    doLast {
        def artifacts = configurations.shadowBundle.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group == 'ca.spottedleaf.leafpile'
        }
        def expectedModules = ['common', 'concurrentutil', 'converter', 'ioutil'] as Set
        if (artifacts.collect { it.name }.toSet() != expectedModules) {
            throw new GradleException('The Moonrise distribution must include all four Leafpile runtime modules')
        }
        new java.util.zip.ZipFile(tasks.named('shadowJar').get().archiveFile.get().asFile).withCloseable { distribution ->
            artifacts.each { artifact ->
                new java.util.zip.ZipFile(artifact.file).withCloseable { library ->
                    library.entries().each { entry ->
                        if (entry.name.endsWith('.class') && !entry.name.endsWith('module-info.class')
                            && distribution.getEntry(entry.name) == null) {
                            throw new GradleException("Missing packaged Moonrise runtime class: ${entry.name}")
                        }
                    }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn verifyMoonriseDistribution }

tasks.register('srgJar', Jar) {
    from(tasks.shadowJar.outputs.files.collect { it.isDirectory() ? it : zipTree(it) }) {
        include 'gr1mly4memes/felt/**'
        eachFile { file ->
            def path = file.path.replace('\\', '/')
            if (path.startsWith('gr1mly4memes/felt/mixin/')
                && !path.startsWith('gr1mly4memes/felt/mixin/fabric/')
                && !path.contains('_Fabric.class')) {
                file.exclude()
            }
        }
    }
    archiveClassifier.set('srg')
    dependsOn shadowJar
}

sourcesJar {
    dependsOn rootProject.tasks.named('verifyPaperUpstream')
}

// Official-name Loom builds use ordinary dependency configurations. Explicitly
// expose runtime mod jars to Fabric's development launcher as mod candidates.
tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.configureEach {
    doFirst {
        def modJars = configurations.runtimeClasspath.files.findAll { dependency ->
            if (!dependency.name.endsWith('.jar')) return false
            new java.util.zip.ZipFile(dependency).withCloseable { zip -> zip.getEntry('fabric.mod.json') != null }
        }
        systemProperty 'fabric.addMods', modJars.collect { it.absolutePath }.join(File.pathSeparator)
    }
}

sourceSets {
    antiXrayVerification {
        java.srcDir 'src/verification/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

tasks.register('testAntiXraySerialization', JavaExec) {
    group = 'verification'
    description = 'Verify anti-xray packet storage round-trips all section positions.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.AntiXraySerializationTest'
}

def testAsyncPacketGate = tasks.register('testAsyncPacketGate', JavaExec) {
    group = 'verification'
    description = 'Verify asynchronous chunk packets preserve network ordering and release failed writes.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.AsyncPacketSendGateTest'
}
tasks.named('check') { dependsOn testAsyncPacketGate }

def testPaperPlatformService = tasks.register('testPaperPlatformService', JavaExec) {
    group = 'verification'
    description = 'Verify the Paper Moonrise platform service descriptor resolves to its compiled provider.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.PaperPlatformServiceTest'
}
tasks.named('check') { dependsOn testPaperPlatformService }

def testMoonriseSchedulingPrimitives = tasks.register('testMoonriseSchedulingPrimitives', JavaExec) {
    group = 'verification'
    description = 'Verify native Moonrise priorities, execution ownership and unload ordering.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.MoonriseSchedulingPrimitivesTest'
}
tasks.named('check') { dependsOn testMoonriseSchedulingPrimitives }

def testMoonriseTicketPropagation = tasks.register('testMoonriseTicketPropagation', JavaExec) {
    group = 'verification'
    description = 'Verify native Moonrise ticket propagation against a distance oracle and concurrent updates.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.MoonriseTicketPropagationTest'
    timeout = Duration.ofMinutes(2)
}
tasks.named('check') { dependsOn testMoonriseTicketPropagation }

def testMoonriseRegionFileIO = tasks.register('testMoonriseRegionFileIO', JavaExec) {
    group = 'verification'
    description = 'Verify native Moonrise storage ordering, cancellation, failure retention and concurrent compression.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.MoonriseRegionFileIOTest'
    timeout = Duration.ofMinutes(2)
}
tasks.named('check') { dependsOn testMoonriseRegionFileIO }

def testMoonriseRegionFiles = tasks.register('testMoonriseRegionFiles', JavaExec) {
    group = 'verification'
    description = 'Verify native Moonrise operations against real region files, including cache eviction and header recovery.'
    dependsOn tasks.named('antiXrayVerificationClasses')
    classpath = sourceSets.antiXrayVerification.runtimeClasspath
    mainClass = 'gr1mly4memes.felt.MoonriseRegionFilesTest'
    timeout = Duration.ofMinutes(2)
}
tasks.named('check') { dependsOn testMoonriseRegionFiles }

def moonriseStorageVerificationMod = tasks.register('moonriseStorageVerificationMod', Jar) {
    dependsOn tasks.named('antiXrayVerificationClasses')
    archiveClassifier = 'moonrise-storage-verification'
    from sourceSets.antiXrayVerification.output
    from 'src/verification/moonrise-mod'
}

loom.runs {
    moonriseStorageVerification {
        server()
        configName = 'Moonrise storage verification'
        runDir = 'build/run_moonrise_storage_verification'
        programArgs '--help'
    }
    moonriseTicketVerification {
        server()
        configName = 'Moonrise ticket verification'
        runDir = 'build/run_moonrise_ticket_verification'
        programArgs '--help'
    }
    moonriseWorldVerification {
        server()
        configName = 'Moonrise live world verification'
        runDir = 'build/run_moonrise_world_verification'
        programArgs '--help'
    }
    moonriseTerrainVerification {
        server()
        configName = 'Moonrise normal terrain verification'
        runDir = 'build/run_moonrise_terrain_verification'
        programArgs '--help'
    }
}

def nativeMixinVerification = tasks.matching { it.name in ['runMoonriseStorageVerification', 'runMoonriseTicketVerification', 'runMoonriseWorldVerification', 'runMoonriseTerrainVerification'] }
nativeMixinVerification.configureEach {
    group = 'verification'
    description = 'Verify native Moonrise operations inside Fabric with the actual mixins applied.'
    dependsOn moonriseStorageVerificationMod
    timeout = Duration.ofMinutes(2)
    doFirst {
        def modJars = configurations.runtimeClasspath.files.findAll { dependency ->
            if (!dependency.name.endsWith('.jar')) return false
            new java.util.zip.ZipFile(dependency).withCloseable { zip -> zip.getEntry('fabric.mod.json') != null }
        }
        modJars += moonriseStorageVerificationMod.get().archiveFile.get().asFile
        systemProperty 'fabric.addMods', modJars.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
tasks.named('runMoonriseTicketVerification') { systemProperty 'felt.verify.tickets', 'true' }
tasks.named('runMoonriseWorldVerification') {
    systemProperty 'felt.verify.world', 'true'
    timeout = Duration.ofMinutes(4)
}
tasks.named('runMoonriseTerrainVerification') {
    systemProperty 'felt.verify.world', 'true'
    systemProperty 'felt.verify.noise', 'true'
    timeout = Duration.ofMinutes(4)
}
tasks.named('check') { dependsOn nativeMixinVerification }
